services:
  superset:
    image: apache/superset:latest
    container_name: superset
    environment:
      SUPERSET_SECRET_KEY: devkey
    ports:
      - "8088:8088"
    volumes:
      - ./superset_init.sh:/docker-entrypoint-initdb.d/superset_init.sh
      - ../../warehouse/gold:/app/warehouse/gold
